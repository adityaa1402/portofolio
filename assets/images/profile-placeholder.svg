<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#111c38"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>

    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="360" x2="400" y2="360"/>
  </g>

  <!-- Outer Rounded Border -->
  <rect x="12" y="12" width="376" height="376" rx="24" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Minimalist Studio Monogram Silhouette -->
  <circle cx="200" cy="165" r="70" fill="#152347" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="200" cy="145" r="32" fill="#2563eb" opacity="0.85"/>
  <path d="M 148 220 C 148 185, 252 185, 252 220 Z" fill="#2563eb" opacity="0.85"/>

  <!-- Elegant Status Pill -->
  <g transform="translate(100, 260)">
    <rect width="200" height="38" rx="19" fill="#070d1a" stroke="#1d4ed8" stroke-width="1.2"/>
    <circle cx="24" cy="19" r="4.5" fill="#10b981"/>
    <text x="38" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">ADITYA SAPUTRA</text>
  </g>

  <g transform="translate(125, 310)">
    <text x="75" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">SMKN 20 JAKARTA • RPL</text>
  </g>
</svg>